name: Check Charybdis Ark
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run keycodes -- --check
      - run: npm run preview
      - name: Load the native HID module
        run: node -e "require('node-hid')"

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/charybdis-4x6
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          fetch-depth: 0
          path: .ci/firmware
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'noah-userspace-contracts' }}
          fetch-depth: 0
          path: .ci/qmk
      - run: node scripts/check-pins.js --firmware .ci/firmware --qmk .ci/qmk
      - name: Check upstream/ reproduces exactly from its pins
        run: node scripts/refresh-upstream.js --check --firmware .ci/firmware --qmk .ci/qmk
      - name: Test the selected published stack
        run: npm run test:compat -- --firmware .ci/firmware --ark . --qmk .ci/qmk --publish --report "${{ runner.temp }}/compat.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-report
          path: ${{ runner.temp }}/compat.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: test-results/
