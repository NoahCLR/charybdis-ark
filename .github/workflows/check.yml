name: Check Charybdis Ark
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly early warning: does firmware dev still work with this Ark?
    - cron: "23 3 * * *"
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run keycodes -- --check
      - run: npm run preview
      - name: Load the native HID module
        run: node -e "require('node-hid')"

  compatibility:
    # Required on main. Ark against exactly the firmware and QMK commits it
    # pins, so firmware can move ahead without turning Ark red. Release tags
    # test the same tag in all three repositories.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Read the pinned firmware and QMK commits
        id: pins
        run: node -e 'const s = require("./upstream/manifest.json").sources; console.log("firmware=" + s.firmware.commit + "\nqmk=" + s.qmk.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/charybdis-4x6
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.pins.outputs.firmware }}
          fetch-depth: 0
          path: .ci/firmware
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.pins.outputs.qmk }}
          fetch-depth: 0
          path: .ci/qmk
      - run: node scripts/check-pins.js --firmware .ci/firmware --qmk .ci/qmk
      - name: Check upstream/ reproduces exactly from its pins
        run: node scripts/refresh-upstream.js --check --firmware .ci/firmware --qmk .ci/qmk
      - name: Test the pinned published stack
        run: npm run test:compat -- --firmware .ci/firmware --ark . --qmk .ci/qmk --publish --report "${{ runner.temp }}/compat.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-report
          path: ${{ runner.temp }}/compat.json

  agreement:
    # Required on main. Firmware states its contract (tests/host/
    # run_contract_probe.sh); Ark judges it with its own runtime code
    # (scripts/check-agreement.js), against BK at firmware's pin. Firmware main
    # on PRs to main, the release tag on tags, firmware dev otherwise (also
    # nightly: would a release agree today?).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/charybdis-4x6
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.base_ref == 'main' && 'main' || 'dev') }}
          path: .ci/firmware
          persist-credentials: false
      - name: Read firmware's BK pin
        id: pin
        run: node -e 'console.log("commit=" + require("./.ci/firmware/qmk-pin.json").commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ steps.pin.outputs.commit }}
          path: .ci/qmk
          persist-credentials: false
      - name: Judge the firmware contract
        run: node scripts/check-agreement.js --firmware .ci/firmware --qmk .ci/qmk --report "${{ runner.temp }}/agreement.json" --markdown "${{ runner.temp }}/agreement.md"
      - name: Show the agreement table
        if: always()
        run: cat "${{ runner.temp }}/agreement.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agreement-report
          path: |
            ${{ runner.temp }}/agreement.json
            ${{ runner.temp }}/agreement.md

  compatibility-heads:
    # Early warning, not required: Ark against firmware dev and the BK trunk as
    # they are now. Red means firmware moved in a way Ark must follow (re-pin
    # with npm run upstream, update codecs); it never blocks landing or promotion.
    name: compatibility with firmware dev (early warning)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/charybdis-4x6
          ref: dev
          fetch-depth: 0
          path: .ci/firmware
      - uses: actions/checkout@v6
        with:
          repository: NoahCLR/bastardkb-qmk
          ref: noah-userspace-contracts-dev
          fetch-depth: 0
          path: .ci/qmk
      - name: Test Ark against the current firmware and BK trunks
        run: npm run test:compat -- --firmware .ci/firmware --ark . --qmk .ci/qmk --report "${{ runner.temp }}/compat-heads.json"
      - name: Explain a failure
        if: failure()
        run: |
          echo "Firmware dev or the BK trunk changed in a way this Ark does not handle yet." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow up in Ark: re-pin with npm run upstream, update codecs and tests." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-heads-report
          path: ${{ runner.temp }}/compat-heads.json

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: test-results/
