name: Publish the web page

# Publishes the web page (D-L52) to Cloudflare Pages: dev to the preview
# address dev.<project>.pages.dev, main (a release) to the production branch
# and its custom domain. It is D-L51's one exception, the only workflow that
# runs on dev pushes: its browser test gates this publish and nothing else, and
# it is never a required check. Each run builds the page, tests the built files
# in Chrome, checks they are static files only, and only then uploads them.
# Never on pull requests: publishing needs the Cloudflare secrets.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One publish at a time per branch; a newer push waits, never cancels an upload.
  group: publish-web-${{ github.ref }}
  cancel-in-progress: false
env:
  # The Cloudflare Pages project (direct upload, production branch main).
  PAGES_PROJECT: charybdis-ark
jobs:
  publish:
    # Not "check" or "browser": a job of that name on dev's head commit would
    # stand in for the promotion pull request's required checks.
    name: Build, test and publish the web page
    runs-on: ubuntu-latest
    steps:
      - name: Publish only dev and main
        run: |
          case "$GITHUB_REF_NAME" in
            dev|main) echo "Publishing $GITHUB_REF_NAME to the Pages project $PAGES_PROJECT" ;;
            *) echo "::error::Only dev and main are published; $GITHUB_REF_NAME is neither."; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the web page
        run: ARK_COMMIT="$(git rev-parse --short "$GITHUB_SHA")" npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Test the built page in Chrome
        # ARK_WEB_BUILT: test dist/web/ as built above, without rebuilding it.
        env:
          ARK_WEB_BUILT: "1"
        run: npx playwright test browser-tests/web-page.spec.js browser-tests/web-build.spec.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: publish-test-failure
          path: test-results/
      - name: Check it is static files only
        run: node scripts/check-static-site.js dist/web
      - name: Require the Cloudflare credentials
        # Fails, rather than skipping, so a missing secret shows as a red run
        # instead of a green one that left the address on an old page.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::The repository secrets$missing are not set, so nothing was published. The page was built and tested. See docs/REPOSITORY.md, Publishing the web page."
            exit 1
          fi
      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy dist/web --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Say where it went
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "Published $GITHUB_REF_NAME ($(git rev-parse --short "$GITHUB_SHA")) to the Pages project $PAGES_PROJECT."
            echo ""
            echo "- This deployment: $DEPLOYMENT_URL"
            [ -z "$ALIAS_URL" ] || echo "- Branch address: $ALIAS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
