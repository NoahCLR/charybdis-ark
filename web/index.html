<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page's policy travels with it, so it holds under any server. It is
     scripts/build-web.js's POLICY; the published page also gets it as a header,
     with frame-ancestors (web/_headers). -->
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- Out of search engines at every address it is published to (also a header). -->
<meta name="robots" content="noindex, nofollow">
<meta name="generator" content="Charybdis Ark {{version}} ({{commit}})">
<title>Charybdis Ark</title>
<!-- The board on black (scripts/web-icon.js): the tab's icon, and what a
     saved web app shows, in Safari and in Chrome. -->
<link rel="icon" href="./{{favicon}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="./{{touch}}">
<link rel="manifest" href="./{{manifest}}">
<link rel="stylesheet" href="./{{styles}}">
<!-- The shell loads the panel once it is running, or on a phone shows a notice
     instead (web/page.mjs); the panel is fetched alongside it meanwhile. -->
<script type="module" src="./{{shell}}"></script>
<link rel="modulepreload" href="./{{panel}}">
</head>
<body>
<!-- What the page says if the shell never starts: no JavaScript, a file that
     did not load, an address below the root, a browser too old for it. The
     shell replaces it as it starts (web/page.mjs); the stylesheet keeps it
     unseen for a moment first, so an ordinary load never shows it. -->
<div id="root"><main class="load-failure page-starting">
<h1>Charybdis Ark</h1>
<p>Ark edits your Charybdis keyboard from this page. It needs Chrome or Edge on a computer, with JavaScript on.</p>
<noscript><p>JavaScript is off for this page. Turn it on to use Ark.</p></noscript>
<p>If this is all you see, Ark did not start. Reload the page, or open <a href="/">Ark's own address</a>.</p>
</main></div>
</body>
</html>
