<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page's policy travels with it, so it holds under any server. It is
     scripts/build-web.js's POLICY; the published page also gets it as a header,
     with frame-ancestors (web/_headers). -->
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- Out of search engines at every address it is published to (also a header). -->
<meta name="robots" content="noindex, nofollow">
<meta name="generator" content="Charybdis Ark {{version}} ({{commit}})">
<title>Charybdis Ark</title>
<link rel="stylesheet" href="./{{styles}}">
<!-- The host loads the panel once it is running, or on a phone shows a notice
     instead (web/page.mjs); the panel is fetched alongside it meanwhile. -->
<script type="module" src="./{{host}}"></script>
<link rel="modulepreload" href="./{{panel}}">
</head>
<body>
<div id="root"></div>
</body>
</html>
